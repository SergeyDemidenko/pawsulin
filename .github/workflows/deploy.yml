name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add remote host to known hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose file to server
        run: |
          scp docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/pawsulin/docker-compose.yml"

      - name: Deploy via docker-compose
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.image-tag.outputs.tag }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.image-tag.outputs.tag }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'ENDSSH'
            set -e
            cd ~/pawsulin

            # Log in to GHCR using a PAT with package:read scope
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            # Pull latest images
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" \
            FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS }}" \
            docker compose pull

            # Deploy with zero-downtime restart
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}" \
            FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            CORS_ALLOWED_ORIGINS="${{ vars.CORS_ALLOWED_ORIGINS }}" \
            docker compose up -d --remove-orphans

            docker image prune -f
          ENDSSH

      - name: Verify deployment health
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'ENDSSH'
            set -e
            HEALTH_URL="${{ vars.BACKEND_HEALTH_URL || 'http://localhost:8080/actuator/health' }}"
            RETRIES=10
            until curl -sf "$HEALTH_URL" | grep -q '"status":"UP"'; do
              RETRIES=$((RETRIES - 1))
              if [ "$RETRIES" -eq 0 ]; then
                echo "Health check failed after 10 attempts."
                exit 1
              fi
              echo "Waiting for backend to be healthy... ($RETRIES attempts left)"
              sleep 10
            done
            echo "Backend is healthy."
          ENDSSH
